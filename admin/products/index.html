<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - FreshMart Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-global.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
        <div>
            <div class="sidebar-header">
                <a href="../dashboard/index.html" class="admin-logo">
                    <i class="fas fa-basket-shopping"></i> Fresh<span>Mart</span>
                    <span class="admin-badge">Admin</span>
                </a>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-label">Main Menu</div>
                <a href="../dashboard/index.html" class="menu-item">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="../banners/index.html" class="menu-item">
                    <i class="fas fa-images"></i> Banners
                </a>
                <a href="../categories/index.html" class="menu-item">
                    <i class="fas fa-list-check"></i> Categories
                </a>
                <a href="../products/index.html" class="menu-item active">
                    <i class="fas fa-box-open"></i> Products
                </a>
                <a href="../orders/index.html" class="menu-item">
                    <i class="fas fa-cart-shopping"></i> Orders
                </a>
                <a href="../customers/index.html" class="menu-item">
                    <i class="fas fa-users"></i> Customers
                </a>

                <div class="menu-label">System & Content</div>
                <a href="../contact/index.html" class="menu-item">
                    <i class="fas fa-address-book"></i> Contact Info
                </a>
                <a href="../settings/index.html" class="menu-item">
                    <i class="fas fa-gear"></i> Website Settings
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="../../index.html" target="_blank" class="btn-admin btn-admin-outline" style="width:100%; margin-bottom:0.5rem; justify-content:center;">
                <i class="fas fa-external-link"></i> View Website
            </a>
            <button onclick="adminLogout()" class="btn-admin btn-admin-danger" style="width:100%; justify-content:center;">
                <i class="fas fa-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-title">Product Catalogue Management</div>
            <div class="topbar-actions">
                <a href="product-form.html" class="btn-admin btn-admin-primary">
                    <i class="fas fa-plus"></i> Add New Product
                </a>
            </div>
        </header>

        <main class="admin-body">
            <div class="admin-card">
                <!-- Filters & Search Bar -->
                <div style="display:flex; justify-space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem;">
                    <div style="display:flex; gap:0.75rem; flex:1; max-width:500px;">
                        <input type="text" id="search-product" class="admin-form-input" placeholder="Search by product name, brand, SKU..." oninput="renderProductsList()" />
                        <select id="filter-category" class="admin-form-select" onchange="renderProductsList()" style="width:180px;">
                            <option value="">All Categories</option>
                        </select>
                    </div>

                    <div style="font-size:0.875rem; color:var(--admin-muted);">
                        Real-time Supabase DB inventory
                    </div>
                </div>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>IMAGE</th>
                            <th>PRODUCT NAME & SKU</th>
                            <th>CATEGORY</th>
                            <th>PRICE (৳)</th>
                            <th>STOCK STATUS</th>
                            <th>VARIANTS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Rendered by products.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Supabase SDK & Modules -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase/config.js"></script>
    <script src="../../js/supabase/client.js"></script>
    <script src="../../js/supabase/categories.js"></script>
    <script src="../../js/supabase/products.js"></script>
    <script src="../../js/supabase/banners.js"></script>
    <script src="../../js/supabase/orders.js"></script>
    <script src="../../js/supabase/customers.js"></script>
    <script src="../../js/supabase/settings.js"></script>
    <script src="../../js/supabase/storage.js"></script>

    <!-- Core Admin Scripts -->
    <script src="../../js/data.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="products.js"></script>
</body>
</html>
