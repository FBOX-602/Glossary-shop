<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form - FreshMart Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-global.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
        <div>
            <div class="sidebar-header">
                <a href="../dashboard/index.html" class="admin-logo">
                    <i class="fas fa-basket-shopping"></i> Fresh<span>Mart</span>
                    <span class="admin-badge">Admin</span>
                </a>
            </div>

            <nav class="sidebar-menu">
                <div class="menu-label">Main Menu</div>
                <a href="../dashboard/index.html" class="menu-item">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="../banners/index.html" class="menu-item">
                    <i class="fas fa-images"></i> Banners
                </a>
                <a href="../categories/index.html" class="menu-item">
                    <i class="fas fa-list-check"></i> Categories
                </a>
                <a href="../products/index.html" class="menu-item active">
                    <i class="fas fa-box-open"></i> Products
                </a>
                <a href="../orders/index.html" class="menu-item">
                    <i class="fas fa-cart-shopping"></i> Orders
                </a>
                <a href="../customers/index.html" class="menu-item">
                    <i class="fas fa-users"></i> Customers
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="../../index.html" target="_blank" class="btn-admin btn-admin-outline" style="width:100%; margin-bottom:0.5rem; justify-content:center;">
                <i class="fas fa-external-link"></i> View Website
            </a>
            <button onclick="adminLogout()" class="btn-admin btn-admin-danger" style="width:100%; justify-content:center;">
                <i class="fas fa-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-title" id="form-heading">Add New Product</div>
            <div class="topbar-actions">
                <a href="index.html" class="btn-admin btn-admin-outline">
                    <i class="fas fa-arrow-left"></i> Back to Products
                </a>
            </div>
        </header>

        <main class="admin-body">
            <form onsubmit="handleProductFormSubmit(event)" id="product-edit-form">
                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:1.5rem;">
                    
                    <!-- Left Main Form Card -->
                    <div class="admin-card">
                        <h4 style="font-size:1rem; margin-bottom:1.25rem; border-bottom:1px solid var(--admin-border); padding-bottom:0.5rem;">Basic Product Information</h4>

                        <div class="admin-form-group">
                            <label class="admin-form-label">Product Name *</label>
                            <input type="text" id="p-name" class="admin-form-input" required placeholder="e.g. Royal India Premium Long Grain Basmati Rice" />
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem;">
                            <div class="admin-form-group">
                                <label class="admin-form-label">SKU / Product ID *</label>
                                <input type="text" id="p-id" class="admin-form-input" required placeholder="e.g. rice-05" />
                            </div>
                            <div class="admin-form-group">
                                <label class="admin-form-label">Brand Name *</label>
                                <input type="text" id="p-brand" class="admin-form-input" required placeholder="e.g. Royal India" />
                            </div>
                            <div class="admin-form-group">
                                <label class="admin-form-label">Category *</label>
                                <select id="p-category" class="admin-form-select" required></select>
                            </div>
                        </div>

                        <div class="admin-form-group" style="margin-top:1rem;">
                            <label class="admin-form-label">Short Summary Description</label>
                            <input type="text" id="p-shortDescription" class="admin-form-input" placeholder="Aromatic extra-long grain basmati rice..." />
                        </div>

                        <div class="admin-form-group">
                            <label class="admin-form-label">Full Detailed Description</label>
                            <textarea id="p-description" class="admin-form-textarea" rows="4" placeholder="Detailed product specifications, taste profile, harvest background..."></textarea>
                        </div>

                        <!-- Weight / Size Variants Manager -->
                        <h4 style="font-size:1rem; margin-top:1.5rem; margin-bottom:0.85rem; border-bottom:1px solid var(--admin-border); padding-bottom:0.5rem;">Weight / Size / Pack Variants</h4>
                        <div id="variants-manager-list" style="margin-bottom:0.85rem;"></div>
                        <button type="button" onclick="addVariantRow()" class="btn-admin btn-admin-outline btn-admin-sm">
                            <i class="fas fa-plus"></i> Add Variant Option
                        </button>

                        <!-- Additional Specifications -->
                        <h4 style="font-size:1rem; margin-top:1.5rem; margin-bottom:0.85rem; border-bottom:1px solid var(--admin-border); padding-bottom:0.5rem;">Product Specifications & Expiry</h4>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                            <div class="admin-form-group">
                                <label class="admin-form-label">Ingredients</label>
                                <input type="text" id="p-ingredients" class="admin-form-input" placeholder="100% Pure Basmati Rice" />
                            </div>
                            <div class="admin-form-group">
                                <label class="admin-form-label">Country of Origin</label>
                                <input type="text" id="p-origin" class="admin-form-input" placeholder="India" />
                            </div>
                            <div class="admin-form-group">
                                <label class="admin-form-label">Storage Instructions</label>
                                <input type="text" id="p-storage" class="admin-form-input" placeholder="Store in a cool dry place" />
                            </div>
                            <div class="admin-form-group">
                                <label class="admin-form-label">Expiry Information</label>
                                <input type="text" id="p-expiry" class="admin-form-input" placeholder="24 Months from MFD" />
                            </div>
                        </div>
                    </div>

                    <!-- Right Side Pricing & Media Card -->
                    <div>
                        <div class="admin-card">
                            <h4 style="font-size:1rem; margin-bottom:1rem; border-bottom:1px solid var(--admin-border); padding-bottom:0.4rem;">Pricing & Stock Inventory</h4>

                            <div class="admin-form-group">
                                <label class="admin-form-label">Current Selling Price (৳) *</label>
                                <input type="number" step="0.01" id="p-price" class="admin-form-input" required placeholder="1450.00" />
                            </div>

                            <div class="admin-form-group">
                                <label class="admin-form-label">Original Strikethrough Price (৳)</label>
                                <input type="number" step="0.01" id="p-originalPrice" class="admin-form-input" placeholder="1800.00" />
                            </div>

                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                                <div class="admin-form-group">
                                    <label class="admin-form-label">Stock Qty *</label>
                                    <input type="number" id="p-stock" class="admin-form-input" required placeholder="50" value="50" />
                                </div>
                                <div class="admin-form-group">
                                    <label class="admin-form-label">Availability *</label>
                                    <select id="p-inStock" class="admin-form-select">
                                        <option value="true">In Stock</option>
                                        <option value="false">Out of Stock</option>
                                    </select>
                                </div>
                            </div>

                            <div class="admin-form-group" style="margin-top:0.5rem;">
                                <label style="display:flex; align-items:center; gap:0.5rem; font-weight:700; cursor:pointer;">
                                    <input type="checkbox" id="p-isFeatured" style="accent-color:var(--admin-primary);" />
                                    <span>Mark as Featured / Popular Deal</span>
                                </label>
                            </div>
                        </div>

                        <!-- Product Media Card -->
                        <div class="admin-card">
                            <h4 style="font-size:1rem; margin-bottom:1rem; border-bottom:1px solid var(--admin-border); padding-bottom:0.4rem;">Product Images</h4>

                            <div class="admin-form-group">
                                <label class="admin-form-label">Upload Product Image to Supabase Storage</label>
                                <input type="file" id="p-file" class="admin-form-input" accept="image/*" style="margin-bottom:0.5rem;" />
                                <label class="admin-form-label">Or Main Image URL *</label>
                                <input type="url" id="p-image" class="admin-form-input" required placeholder="https://images.unsplash.com/..." />
                            </div>

                            <div class="admin-form-group">
                                <label class="admin-form-label">Gallery Thumbnail URLs (One per line)</label>
                                <textarea id="p-thumbnails" class="admin-form-textarea" rows="3" placeholder="https://images.unsplash.com/..."></textarea>
                            </div>

                            <button type="submit" class="btn-admin btn-admin-primary" style="width:100%; margin-top:1rem; padding:0.75rem; font-size:1rem;">
                                <i class="fas fa-save"></i> Save & Publish Product
                            </button>
                        </div>
                    </div>

                </div>
            </form>
        </main>
    </div>

    <!-- Supabase SDK & Modules -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase/config.js"></script>
    <script src="../../js/supabase/client.js"></script>
    <script src="../../js/supabase/categories.js"></script>
    <script src="../../js/supabase/products.js"></script>
    <script src="../../js/supabase/banners.js"></script>
    <script src="../../js/supabase/orders.js"></script>
    <script src="../../js/supabase/customers.js"></script>
    <script src="../../js/supabase/settings.js"></script>
    <script src="../../js/supabase/storage.js"></script>

    <!-- Core Admin Scripts -->
    <script src="../../js/data.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../js/admin-auth.js"></script>
    <script src="products.js"></script>
</body>
</html>
